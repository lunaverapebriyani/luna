<style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #EAF8F5;
    }

    .navbar {
      background: linear-gradient(to right, #0073B7, #009B4C);
      padding: 30px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo {
      font-size: 50px;
      font-weight: bold;
      margin: 0;
    }

    .logo-sub {
      font-size: 25px;
      margin-top: 4px;
    }

    .nav-links {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 12px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .nav-links a {
      color: #009B4C;
      text-decoration: none;
      font-weight: 500;
    }

    .nav-links a:hover {
       color: #0073B7;
    }

    .user-menu {
      margin-left: auto;
      color:rgb(222, 237, 229);
      font-weight: bold;
    }

    .content {
      padding: 20px;
      max-width: 800px;
 
    }

    .card {
      background: #fff;
      border-left: 5px solid #009B4C;
      border-radius: 8px;
      margin-bottom: 20px;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
     
    }

    .card-title {
      font-weight: bold;
      margin-bottom: 5px;
      color: #0073B7;
    }

    .card-text {
      font-size: 14px;
      color: #444;
    }

    .card-image {
      width: 50px;
      height: 50px;
      background: #D9F3EF;
      border-radius: 8px;
    }
